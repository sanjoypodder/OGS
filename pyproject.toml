[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ogs-smart-money-ai"
version = "0.1.0-alpha.1"
description = "Institutional Smart Money Trading Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Om Ganapati Solution", email = "your-email@example.com" }
]

keywords = [
    "Trading",
    "Smart Money",
    "ICT",
    "Institutional",
    "Python",
    "Forex",
    "Gold",
    "XAUUSD",
    "Bitcoin",
    "AI"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

# -------------------------------------------------
# Black
# -------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py313"]

# -------------------------------------------------
# Ruff
# -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "N",   # pep8 naming
    "UP",  # pyupgrade
    "B",   # bugbear
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# -------------------------------------------------
# Pytest
# -------------------------------------------------

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "-ra",
    "--strict-markers",
]

# -------------------------------------------------
# Coverage
# -------------------------------------------------

[tool.coverage.run]
source = ["src/ogs"]

[tool.coverage.report]
show_missing = true
skip_empty = true

# -------------------------------------------------
# Mypy (Future)
# -------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true